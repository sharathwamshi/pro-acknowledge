# Acknowledger — nginx site config for https://proafpl.anametaiot.com
#
# Serves the built frontend at / and reverse-proxies the API at /api/ to the
# uvicorn backend on 127.0.0.1:8000. Put this in /etc/nginx/sites-available/
# and symlink it into sites-enabled, or paste into your existing server block.
#
# TLS: the 443 block below assumes certs exist. Easiest path is certbot:
#   sudo certbot --nginx -d proafpl.anametaiot.com
# which fills in the ssl_certificate lines for you.

server {
    listen 80;
    server_name proafpl.anametaiot.com;
    # Redirect everything to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proafpl.anametaiot.com;

    # --- TLS (certbot manages these) ---
    ssl_certificate     /etc/letsencrypt/live/proafpl.anametaiot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proafpl.anametaiot.com/privkey.pem;

    # --- Frontend: the built SPA ---
    root /var/www/acknowledger;          # put the frontend 'dist' contents here
    index index.html;

    # SPA deep links (e.g. /users/18 on refresh) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API: strip /api/ and forward to uvicorn ---
    # Trailing slash on proxy_pass replaces "/api/" with "/", so
    # /api/auth/login -> http://127.0.0.1:8000/auth/login
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 10m;
}
