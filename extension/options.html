<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Acknowledger URL Reporter — Settings</title>
<style>
  body { font-family: Inter, system-ui, sans-serif; max-width: 420px; margin: 40px auto; color: #16202E; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
  input { width: 100%; padding: 9px 11px; border: 1px solid #D3DBE6; border-radius: 8px; }
  button { margin-top: 16px; padding: 10px 16px; border: none; border-radius: 8px; background: #1D5B9E; color: #fff; font-weight: 600; cursor: pointer; }
  button.ghost { background: #fff; color: #1D5B9E; border: 1px solid #D3DBE6; margin-left: 8px; }
  .msg { font-size: 13px; margin-top: 12px; }
  .ok { color: #2E9E5B; }
  .err { color: #CB4154; }
  p { color: #687E97; font-size: 12.5px; line-height: 1.6; }
</style>
</head>
<body>
  <h2>URL Reporter settings</h2>
  <p>Paste the same device token the desktop agent created — shown in the popup
     after you register, and saved in
     <code>%LOCALAPPDATA%\Acknowledger\agent_state.json</code> — so browser
     activity attaches to the same person.</p>
  <label>Server URL</label>
  <input id="server" placeholder="https://proafpl.anametaiot.com">
  <label>Device token</label>
  <input id="token" placeholder="paste device_token here">
  <div>
    <button id="save">Save</button>
    <button id="test" class="ghost">Test connection</button>
  </div>
  <div class="msg" id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
